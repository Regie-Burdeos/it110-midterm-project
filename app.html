<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="quote-pagess">
    <header>
        <div>
            <h1>Random Quote Generator</h1>
            <p>small quotes, big comfort.</p>
        </div>

        <div class="theme-toggle">
            <button class="theme-btn active" id="changeimage" aria-label="Day mode">☀</button>
            <button class="theme-btn" id="changeimages" aria-label="Night mode">🌙</button>
        </div>
    </header>

    <main class="quote-card">
        <button class="heart" aria-label="Like quote">♡</button>

        <h2 id="quotetext">“Click to get a Quote^^”</h2>

        <div class="divider">♡</div>

        <p class="author" id="authors">— </p>

        <div class="buttons">
            <button class="icon-btn" aria-label="Favorite quote">♡</button>
            <button class="new-quote" id="new-quotes">New Quote</button>
            <button class="icon-btn" aria-label="Copy quote">↪</button>
        </div>
    </main>

    <footer>
        ♡ good quotes for a brighter you ♡
    </footer>

    <script src="script.js"></script>
</body>
</html>
