<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div>
            <h1>Random Quote Generator</h1>
            <p>small quotes, big comfort.</p>
        </div>

        <button class="theme-btn">☀</button>
    </header>

    <main class="quote-card">
        <button class="heart">♡</button>

        <h2>“Small steps every day<br>
            lead to big results.”</h2>

        <div class="divider">♡</div>

        <p class="author">— Unknown</p>

        <div class="buttons">
            <button class="icon-btn">♡</button>
            <button class="new-quote">New Quote</button>
            <button class="icon-btn">♧</button>
        </div>
    </main>

    <footer>
        ♡ good quotes for a brighter you ♡
    </footer>

</body>
</html
